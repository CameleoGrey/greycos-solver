# Axioms of the release pipeline:
# - Each release starts from greycos-solver by running this GitHub Action.
# - Each repository only starts its own release after its dependencies are fully released.
# - Development versions remain 999-SNAPSHOT, including on micro branches.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (MAJOR.MINOR.PATCH, e.g. 0.11.14)'
        required: true
      sourceBranch:
        description: 'Branch to cut the release from'
        default: main
        required: true
      dryRun:
        description: 'Validate the release without changing remote state'
        default: true
        required: true
        type: boolean

concurrency:
  group: greycos-solver-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
    env:
      MAVEN_ARGS: "--no-transfer-progress --batch-mode"
      RELEASE_BRANCH_NAME: "__greycos_release_branch__"
      RELEASE_VERSION: ${{ github.event.inputs.version }}
      DRY_RUN: ${{ github.event.inputs.dryRun }}

    steps:
      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release version '$RELEASE_VERSION' must use MAJOR.MINOR.PATCH format."
            exit 1
          fi

      - name: Checkout greycos-solver
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.sourceBranch }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check release state
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/heads/$RELEASE_BRANCH_NAME" >/dev/null 2>&1; then
            echo "Remote branch '$RELEASE_BRANCH_NAME' already exists. Preserve and inspect it before retrying."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            echo "Tag 'v$RELEASE_VERSION' already exists. Maven Central releases are immutable."
            exit 1
          fi
          current_version="$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$current_version" != "999-SNAPSHOT" ]]; then
            echo "The source branch must use 999-SNAPSHOT; found '$current_version'."
            exit 1
          fi
          git diff --exit-code
          git diff --cached --exit-code

      - name: Verify release secrets
        shell: bash
        env:
          CENTRAL_TOKEN_USER: ${{ secrets.JRELEASER_MAVEN_CENTRAL_TOKEN_USER }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.JRELEASER_MAVEN_CENTRAL_TOKEN }}
          GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CENTRAL_TOKEN_USER" ]] || missing+=(JRELEASER_MAVEN_CENTRAL_TOKEN_USER)
          [[ -n "$CENTRAL_TOKEN_PASSWORD" ]] || missing+=(JRELEASER_MAVEN_CENTRAL_TOKEN)
          [[ -n "$GPG_PUBLIC_KEY" ]] || missing+=(JRELEASER_GPG_PUBLIC_KEY)
          [[ -n "$GPG_SECRET_KEY" ]] || missing+=(JRELEASER_GPG_SECRET_KEY)
          [[ -n "$GPG_PASSPHRASE" ]] || missing+=(JRELEASER_GPG_PASSPHRASE)
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing repository secret: %s\n' "${missing[@]}"
            exit 1
          fi

          central_bearer="$(printf '%s:%s' "$CENTRAL_TOKEN_USER" "$CENTRAL_TOKEN_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$central_bearer"
          printf 'JRELEASER_MAVENCENTRAL_TOKEN=%s\n' "$central_bearer" >> "$GITHUB_ENV"

      - name: Create local release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GreyCOS Release Bot"
          git config user.email "cameleogrey@yandex.ru"
          git switch -c "$RELEASE_BRANCH_NAME"

      - name: Set release version and stage the full reactor
        shell: bash
        run: |
          set -euo pipefail
          ./mvnw -Dfull versions:set -DnewVersion="$RELEASE_VERSION" -DgenerateBackupPoms=false
          ./mvnw -Dfull clean deploy -DskipTests="$DRY_RUN" \
            -DaltDeploymentRepository="local::file://$GITHUB_WORKSPACE/target/staging-deploy"
          cp docs/target/antora.yml docs/src/antora.yml

          git add -- docs/src/antora.yml
          git ls-files -z -- pom.xml ':(glob)**/pom.xml' | xargs -0 git add --

          if [[ -n "$(git diff --name-only)" ]]; then
            echo "The release build changed unexpected tracked files:"
            git diff --name-only
            exit 1
          fi
          while IFS= read -r changed_file; do
            case "$changed_file" in
              pom.xml|*/pom.xml|docs/src/antora.yml) ;;
              *)
                echo "Unexpected staged release file: $changed_file"
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)

          git commit -m "build: release version $RELEASE_VERSION"
          if [[ "$DRY_RUN" == "false" ]]; then
            git push --set-upstream origin "$RELEASE_BRANCH_NAME"
          fi

      - name: Verify Maven Central staging repository
        run: .github/scripts/verify-central-staging.sh "$RELEASE_VERSION"

      - name: Run JReleaser
        uses: jreleaser/release-action@90ac653bb9c79d11179e65d81499f3f34527dcd5 # 2.5.0
        with:
          version: 1.25.0
          setup-java: false
          arguments: full-release
        env:
          JRELEASER_DRY_RUN: ${{ github.event.inputs.dryRun }}
          JRELEASER_PROJECT_VERSION: ${{ github.event.inputs.version }}
          JRELEASER_GITHUB_TOKEN: ${{ github.token }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.JRELEASER_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.JRELEASER_GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.JRELEASER_GPG_SECRET_KEY }}
          JRELEASER_MAVENCENTRAL_STAGE: UPLOAD

      - name: JReleaser release output
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jreleaser-release-${{ github.event.inputs.version }}-${{ github.run_attempt }}
          path: |
            out/jreleaser/trace.log
            out/jreleaser/output.properties
            target/central-staging-manifest.txt
          if-no-files-found: warn
