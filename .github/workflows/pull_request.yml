name: Solver CI

env:
  NODE_OPTIONS: "--max_old_space_size=4096"

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'LICENSE*'
      - '.gitignore'
      - '**/*.md'
      - '**/*.adoc'
      - '**/*.txt'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'LICENSE*'
      - '.gitignore'
      - '**/*.md'
      - '**/*.adoc'
      - '**/*.txt'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: solver-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: "Verify (Ubuntu, Java ${{ matrix.java-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        java-version: [21, 25]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test GreyCOS Solver
        run: ./mvnw -B verify

      - name: Test Summary
        uses: test-summary/action@2920bc1b1b377c787227b204af6981e8f41bbef3
        with:
          paths: "**/TEST-*.xml"
          show: "fail"
        if: always()

  portability:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "Portability (${{ matrix.os }}, Java ${{ matrix.java-version }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04-arm
            java-version: 21
          - os: ubuntu-24.04-arm
            java-version: 25
          - os: macos-latest
            java-version: 25
          - os: windows-latest
            java-version: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test GreyCOS Solver
        run: ./mvnw -B verify

      - name: Test Summary
        uses: test-summary/action@2920bc1b1b377c787227b204af6981e8f41bbef3
        with:
          paths: "**/TEST-*.xml"
          show: "fail"
        if: always()

  full-reactor:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: "Full reactor (Ubuntu, Java 25, no tests)"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'
          cache: 'maven'

      - name: Build the full reactor
        run: ./mvnw -DskipTests -Dfull -B verify
