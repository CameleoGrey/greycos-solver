project:
  name: greycos-solver
  languages:
    java:
      groupId: "io.github.cameleogrey"

signing:
  pgp:
    active: ALWAYS
    armored: true

release:
  github:
    commitAuthor:
      name: "GreyCOS Release Bot"
      email: "cameleogrey@yandex.ru"
    releaseName: "GreyCOS Solver {{projectVersion}}"
    tagName: "v{{projectVersion}}"
    draft: true
    overwrite: false
    sign: true
    milestone:
      close: true
    changelog:
      formatted: ALWAYS
      preset: "conventional-commits"
      contentTemplate: ".github/workflows/release-changelog-template.md"
      contributors:
        format: '- {{contributorName}} ({{contributorUsernameAsLink}})'
      hide:
        uncategorized: true
        categories:
          - build
          - ci
        contributors:
          - "GreyCOS Release Bot"

deploy:
  maven:
    mavenCentral:
      greycos-solver:
        active: RELEASE
        url: https://central.sonatype.com/api/v1/publisher
        authorization: BEARER
        namespace: io.github.cameleogrey
        applyMavenCentralRules: true
        retryDelay: 10
        maxRetries: 180 # 30 minutes for Maven Central state verification
        stagingRepositories:
          - "target/staging-deploy"
        artifactOverrides:
          - groupId: io.github.cameleogrey
            artifactId: greycos-solver-ide-config
            jar: true
            sourceJar: true
            javadocJar: false
            verifyPom: true
          - groupId: io.github.cameleogrey
            artifactId: greycos-solver-webui
            jar: true
            sourceJar: true
            javadocJar: false
            verifyPom: true
